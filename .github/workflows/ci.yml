# Each job's name says which release claim it is evidence for. A target Neo
# supports is only claimed once its job here has passed.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    # Claim: Neo installs, passes lint, starts and serves requests on this OS and
    # Python version, including creating its connector key with the right access.
    name: "Backend lint and startup (${{ matrix.os }}, Python ${{ matrix.python }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the pinned runtime and lint tool
        run: python -m pip install -r requirements.txt ruff==0.16.2
      - name: Lint
        run: python -m ruff check app
      - name: Verify agent tool availability and filesystem behavior
        run: python -m unittest discover -s .github/scripts -p check_agent_tools.py -v
      - name: Verify folder browsing and Agent Mode execution
        run: python -m unittest discover -s .github/scripts -p check_folder_agent.py -v
      - name: Verify a final file action ends the run without extra model calls
        run: python -m unittest discover -s .github/scripts -p check_agent_completion.py -v
      - name: Verify time limits follow measured model speed, never below the defaults
        run: python -m unittest discover -s .github/scripts -p check_model_pace.py -v
      - name: Verify the built-in SearXNG installs itself without touching Neo's packages
        run: python -m unittest discover -s .github/scripts -p check_searxng_install.py -v
      - name: Verify research history delete, clear all, and edited plans
        run: python -m unittest discover -s .github/scripts -p check_research_controls.py -v
      - name: Verify research planning completes when model calls are slow
        run: python -m unittest discover -s .github/scripts -p check_research_budget.py -v
      - name: Verify research end to end on GPU, CPU-only, small, reasoning and hosted models
        run: python -m unittest discover -s .github/scripts -p check_research_e2e.py -v
      - name: Verify research recovers from model, search and time failures, and cancels cleanly
        run: python -m unittest discover -s .github/scripts -p check_research_resilience.py -v
      - name: Verify research is not misled into verified findings by adversarial pages
        run: python -m unittest discover -s .github/scripts -p check_research_adversarial.py -v
      - name: Verify research evidence, source standing, entailment and model-call units
        run: python -m unittest discover -s .github/scripts -p check_research_units.py -v
      - name: Verify research jobs persist, queue on local models and never undo a cancel
        run: python -m unittest discover -s .github/scripts -p check_research_jobs.py -v
      - name: Verify Quick routing, prompt size and streaming latency
        run: python -m unittest discover -s .github/scripts -p check_chat_latency.py -v
      - name: Verify local startup preparation preserves chat prompts
        run: python -m unittest discover -s .github/scripts -p check_chat_startup.py -v
      - name: Verify workspace containment, atomic writes and the folder denylist
        run: python -m unittest discover -s .github/scripts -p check_workspace_safety.py -v
      - name: Verify the CLI sign-in, the agent loop and platform-sensitive answers
        run: python -m unittest discover -s .github/scripts -p check_platform.py -v
      - name: Start Neo and verify the Tools API
        run: python .github/scripts/smoke_neo.py

  frontend:
    # Claim: the interface installs from the lockfile and its production build
    # passes on each desktop operating system.
    name: Frontend production build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    # Claim: the image builds, starts, answers health checks, ships no runtime
    # databases or profile data, and keeps its connector key across a restart.
    name: Docker image build and smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t neo:ci .
      - name: No runtime data in the image
        run: |
          found="$(docker run --rm --entrypoint sh neo:ci -c \
            "find /app/app \( -name '*.db*' -o -name neo_llms.json -o -name profiles \) -print")"
          if [ -n "$found" ]; then echo "$found"; exit 1; fi
      - name: Start, sign in, and check health
        run: |
          docker volume create neo-ci-data
          docker run -d --name neo-ci -p 127.0.0.1:18000:8000 -v neo-ci-data:/app/data neo:ci
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:18000/api/health/live && break; sleep 2; done
          test "$(curl -s http://127.0.0.1:18000/api/health/ready)" = '{"status":"ready"}'
          curl -fsS -c jar -H 'content-type: application/json' \
            -d '{"username":"ci","password":"ci-password"}' http://127.0.0.1:18000/api/account-profiles
          curl -s -b jar http://127.0.0.1:18000/api/health/ready | tee ready.json
          grep -q '"connector_key":{"ok":true' ready.json
      - name: The connector key survives a restart, private
        run: |
          before="$(docker exec neo-ci sha256sum /app/data/secrets/connector-master-key)"
          test "$(docker exec neo-ci stat -c %a /app/data/secrets/connector-master-key)" = 600
          docker restart neo-ci
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:18000/api/health/live && break; sleep 2; done
          after="$(docker exec neo-ci sha256sum /app/data/secrets/connector-master-key)"
          test "$before" = "$after"
      - name: Clean up
        if: always()
        run: |
          docker rm -f neo-ci || true
          docker volume rm neo-ci-data || true
