[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neo"
version = "0.1.0"
description = "Your local personal AI assistant."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=43.0",
    "fastapi>=0.115",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "PyYAML>=6.0",
    "qdrant-client>=1.11",
    "requests>=2.34",
    "sqlalchemy>=2.0",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
neo = "app.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# tests/ is currently absent, so pytest falls back to scanning the repo root. Keep that
# scan out of application code: app/api/routes/test_runner.py is a route module, not a
# test, and importing it as one trips an import cycle that never occurs in normal use.
norecursedirs = [
    ".*",
    "app",
    "build",
    "data",
    "dist",
    "frontend",
    "node_modules",
    "profiles",
    "venv",
    "*.egg-info",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
