# Neo, and nothing else.
#
#   docker compose up -d --build
#
# SearXNG used to be a second service here. It now runs inside Neo's own process
# -- searx.webapp is a Flask WSGI app, so the image bakes in its source tree and
# app/services/search/searxng_embedded.py imports it. That removes this file's
# private network, the SearXNG healthcheck, the depends_on gate that made Neo
# wait on it, and the settings bind-mount, and makes `docker run` and
# `docker compose up` equivalent again.
#
# To use a SearXNG you run yourself instead, set NEO_SEARCH_PROVIDER to
# external_searxng and NEO_SEARXNG_URL to its address.

services:
  neo:
    build: .
    image: neo:latest
    container_name: neo
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      NEO_SEARCH_PROVIDER: searxng
      # SearXNG aggregates upstream engines that rate-limit and serve CAPTCHAs,
      # so keep keyless direct providers behind it rather than failing the turn.
      # The chain also covers a boot failure of the built-in instance itself.
      NEO_WEB_SEARCH_FALLBACK_PROVIDERS: duckduckgo,bing_html
      # Folders may be opened for direct editing only from here down. Attach them
      # by their path *inside* the container -- /workspace/my-project, not the
      # host path it is mounted from. Separate multiple roots with ":" here,
      # because this value is read by the Linux process inside the container.
      NEO_WORKSPACE_LIVE_ROOTS: /workspace
      # The host side of the mount below, passed in so the folder picker can show
      # ~/Desktop for what the server knows as /workspace/Desktop. Read from the
      # same variable the mount uses, so the two cannot drift.
      NEO_WORKSPACE_HOST_ROOT: ${NEO_WORKSPACE_HOST_ROOT:-${HOME:-${USERPROFILE}}}
    # Bind mounts keep the *host's* ownership, so on Linux the container must
    # run as you or every write to your folder fails with EACCES. Set NEO_UID to
    # your own `id -u` in a .env file next to this one. Leave the group at 0:
    # /app/data is group-owned by 0 and group-writable precisely so that any uid
    # can still use it. macOS and Windows need neither -- Docker Desktop maps
    # ownership for you, and the image's own 10001 is correct there.
    user: "${NEO_UID:-10001}:${NEO_GID:-0}"
    volumes:
      - neo-data:/app/data
      # Agent mode edits your files in place, so the container has to be able to
      # see them. Nothing outside this mount is reachable, which is what makes
      # NEO_WORKSPACE_LIVE_ROOTS a real boundary rather than a preference.
      #
      # Your home directory is the default, so projects work where they already
      # live instead of having to be moved into a staging folder. Set
      # NEO_WORKSPACE_HOST_ROOT to narrow it:
      #
      #   macOS         NEO_WORKSPACE_HOST_ROOT=/Users/you
      #   Linux / WSL2  NEO_WORKSPACE_HOST_ROOT=/home/you
      #   Windows       NEO_WORKSPACE_HOST_ROOT=C:\\Users\\you
      #
      # $HOME is unset in a Windows command prompt, so USERPROFILE is the
      # fallback; Docker Desktop must also be sharing whichever path this ends up
      # naming. On Windows, keep projects on the Linux side of WSL2 where you can:
      # a \\wsl$ or C:\ mount crosses a filesystem bridge and is markedly slower.
      #
      # Mounting a home directory does not make all of it a project. /workspace
      # itself is browse-only, and the broad folders (Desktop, Documents, Library,
      # AppData, ...) are refused as destinations while staying browsable. What
      # the agent may then *do* is governed per-operation by
      # app/services/agent_core/permissions.py, not by the folder picker.
      - ${NEO_WORKSPACE_HOST_ROOT:-${HOME:-${USERPROFILE}}}:/workspace

volumes:
  # The anonymous volume the standalone `docker run` container was using, kept
  # by name so existing profiles, chats and the database carry over.
  neo-data:
    external: true
    name: 3a71b43feaa9f05aff321924dc975c7778e1ccf0ad1aec76178c5c2959861066
